[package]
name         = "signal-sema"
version      = "0.2.0"
edition      = "2024"
rust-version = "1.85"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/LiGoldragon/signal-sema"
description  = "Payloadless Sema operation and outcome classifications for component observation."
publish      = false

[lib]
name = "signal_sema"
path = "src/lib.rs"

[features]
default = []
nota-text = ["dep:nota"]

[dependencies]
nota       = { package = "nota", git = "https://github.com/LiGoldragon/nota-next.git", rev = "18e2e8d0dba37e9e84045af3608585b51f6e3b36", optional = true }
rkyv = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
thiserror = "2"

[dev-dependencies]
nota       = { package = "nota", git = "https://github.com/LiGoldragon/nota-next.git", rev = "18e2e8d0dba37e9e84045af3608585b51f6e3b36" }

[lints.rust]
unsafe_code = "forbid"
unused      = { level = "warn", priority = -1 }
dead_code   = { level = "warn", priority = -1 }
